<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Fire 3D - Battle Royale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }
  #gameCanvas { display: block; width: 100vw; height: 100vh; }
  
  /* UI Overlay */
  #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  
  /* Crosshair */
  #crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.8);
  }
  #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }

  /* HUD */
  .hud-box {
    position: absolute; background: rgba(0,0,0,0.6); padding: 8px 12px;
    border-radius: 8px; color: #fff; font-size: 14px; font-weight: bold;
    border: 1px solid rgba(255,255,255,0.2); pointer-events: auto;
  }
  #topHud { top: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; }
  #aliveCount { color: #4ade80; }
  #killCount { color: #fbbf24; }
  #zoneTimer { color: #60a5fa; }

  #healthHud { bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; }
  .bar-bg { width: 180px; height: 16px; background: rgba(0,0,0,0.7); border-radius: 8px; overflow: hidden; border: 1px solid #555; position: relative; }
  .bar-fill { height: 100%; transition: width 0.2s; }
  #hpFill { background: linear-gradient(90deg, #ef4444, #f87171); width: 100%; }
  #armorFill { background: linear-gradient(90deg, #3b82f6, #60a5fa); width: 0%; }
  .bar-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; text-shadow: 1px 1px 2px #000; }

  #weaponHud { bottom: 20px; right: 20px; text-align: right; }
  #weaponName { color: #fbbf24; font-size: 16px; }
  #ammoCount { font-size: 24px; font-weight: bold; }

  /* Minimap */
  #minimap {
    position: absolute; top: 15px; right: 15px; width: 120px; height: 120px;
    background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
    overflow: hidden; pointer-events: none;
  }
  #minimapCanvas { width: 100%; height: 100%; }

  /* Mobile Controls */
  #mobileControls { display: none; pointer-events: none; }
  @media (max-width: 768px) { #mobileControls { display: block; } }
  
  #joystickZone {
    position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px;
    pointer-events: auto; touch-action: none;
  }
  #joystickBase {
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
    position: absolute; top: 10px; left: 10px;
  }
  #joystickThumb {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.6); position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  #fireBtn {
    position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
    border-radius: 50%; background: rgba(239, 68, 68, 0.7); border: 3px solid rgba(255,255,255,0.5);
    color: #fff; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none;
  }
  #fireBtn:active { background: rgba(239, 68, 68, 1); transform: scale(0.95); }

  /* Modals */
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal.hidden { display: none; }
  .modal-content {
    background: linear-gradient(135deg, #1e293b, #0f172a); padding: 30px;
    border-radius: 20px; text-align: center; border: 2px solid #fbbf24; max-width: 400px; width: 90%; color: #fff;
  }
  .modal-content h1 { color: #fbbf24; font-size: 32px; margin-bottom: 10px; }
  .modal-content p { color: #cbd5e1; margin-bottom: 20px; font-size: 14px; }
  .btn {
    padding: 12px 30px; font-size: 16px; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff;
    font-weight: bold; cursor: pointer; pointer-events: auto;
  }
  .btn:active { transform: scale(0.95); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
  .stat-box { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; }
  .stat-val { font-size: 22px; font-weight: bold; color: #fbbf24; }
  .stat-lbl { font-size: 11px; color: #94a3b8; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
  <div id="crosshair"></div>
  
  <div id="topHud">
    <div class="hud-box">👥 <span id="aliveCount">20</span></div>
    <div class="hud-box"> <span id="killCount">0</span></div>
    <div class="hud-box">⭕ <span id="zoneTimer">1:30</span></div>
  </div>

  <div id="minimap"><canvas id="minimapCanvas" width="120" height="120"></canvas></div>

  <div id="healthHud">
    <div class="bar-bg"><div class="bar-fill" id="hpFill"></div><div class="bar-text">❤️ <span id="hpText">100</span></div></div>
    <div class="bar-bg"><div class="bar-fill" id="armorFill"></div><div class="bar-text">️ <span id="armorText">0</span></div></div>
  </div>

  <div id="weaponHud" class="hud-box">
    <div id="weaponName">PISTOL</div>
    <div><span id="ammoCount">12</span> / </div>
  </div>

  <div id="mobileControls">
    <div id="joystickZone"><div id="joystickBase"><div id="joystickThumb"></div></div></div>
    <div id="fireBtn">FIRE</div>
  </div>
</div>

<div class="modal" id="startModal">
  <div class="modal-content">
    <h1>🔥 MINI FIRE 3D</h1>
    <p>Battle Royale 3D Ringan ala Free Fire!</p>
    <div style="text-align:left; font-size:12px; color:#94a3b8; margin-bottom:20px; line-height:1.6;">
      ️ <b>PC:</b> WASD Gerak, Mouse Aim, Klik Tembak, R Reload, Shift Sprint<br>
      📱 <b>Mobile:</b> Joystick Kiri Gerak, Geser Layar Kanan Aim, Tombol FIRE
    </div>
    <button class="btn" onclick="startGame()">🎮 MULAI DROP</button>
  </div>
</div>

<div class="modal hidden" id="endModal">
  <div class="modal-content">
    <h1 id="endTitle">🏆 BOOYAH!</h1>
    <p id="endMsg">Kamu menang!</p>
    <div class="stats">
      <div class="stat-box"><div class="stat-val" id="endKills">0</div><div class="stat-lbl">KILLS</div></div>
      <div class="stat-box"><div class="stat-val" id="endRank">#1</div><div class="stat-lbl">RANK</div></div>
    </div>
    <button class="btn" onclick="location.reload()">🔄 MAIN LAGI</button>
  </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ===== KONFIGURASI GAME =====
const WORLD_SIZE = 400;
const PLAYER_COUNT = 20;
const ZONE_SHRINK_TIME = 90; // detik

const WEAPONS = {
  pistol:  { name: 'PISTOL',  dmg: 20, rate: 400,  speed: 60, spread: 0.02, ammo: 12, reload: 1.5, color: 0xfbbf24 },
  smg:     { name: 'SMG',     dmg: 15, rate: 80,   speed: 70, spread: 0.08, ammo: 30, reload: 2.0, color: 0x60a5fa },
  ar:      { name: 'AR',      dmg: 25, rate: 120,  speed: 80, spread: 0.04, ammo: 25, reload: 2.2, color: 0xa78bfa },
  shotgun: { name: 'SHOTGUN', dmg: 15, rate: 800,  speed: 50, spread: 0.15, ammo: 6,  reload: 2.5, color: 0xef4444, pellets: 5 },
  sniper:  { name: 'SNIPER',  dmg: 80, rate: 1200, speed: 120,spread: 0.005,ammo: 5,  reload: 3.0, color: 0x34d399 }
};

// ===== VARIABEL GLOBAL =====
let scene, camera, renderer, clock;
let player, bots = [], bullets = [], obstacles = [], lootItems = [];
let zone = { radius: WORLD_SIZE/2, targetRadius: WORLD_SIZE/2, x: 0, z: 0, timer: ZONE_SHRINK_TIME, phase: 0 };
let cameraAngle = { yaw: 0, pitch: 0.3 };
let keys = {}, mouse = { x: 0, y: 0, down: false };
let joystick = { active: false, dx: 0, dy: 0 };
let lookTouch = { active: false, startX: 0, startY: 0 };
let isFiring = false;
let gameActive = false;
let kills = 0, aliveCount = PLAYER_COUNT;
let lastShotTime = 0;

// ===== INISIALISASI THREE.JS =====
function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 50, 250);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);
  
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // Lighting
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(50, 100, 50);
  dirLight.castShadow = true;
  dirLight.shadow.camera.left = -100; dirLight.shadow.camera.right = 100;
  dirLight.shadow.camera.top = 100; dirLight.shadow.camera.bottom = -100;
  dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);

  clock = new THREE.Clock();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

// ===== PEMBUATAN DUNIA =====
function createWorld() {
  // Tanah
  const groundGeo = new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x4a7c59 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid tanah (visual)
  const gridHelper = new THREE.GridHelper(WORLD_SIZE, 40, 0x3d6b4a, 0x3d6b4a);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);

  // Rintangan (Pohon & Batu & Gedung)
  const obsGeo1 = new THREE.BoxGeometry(4, 8, 4);
  const obsMat1 = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
  const obsGeo2 = new THREE.CylinderGeometry(2, 2, 6, 8);
  const obsMat2 = new THREE.MeshLambertMaterial({ color: 0x556B2F });
  const obsGeo3 = new THREE.BoxGeometry(10, 12, 10);
  const obsMat3 = new THREE.MeshLambertMaterial({ color: 0x808080 });

  for(let i=0; i<60; i++) {
    let x = (Math.random()-0.5) * WORLD_SIZE * 0.9;
    let z = (Math.random()-0.5) * WORLD_SIZE * 0.9;
    if(Math.abs(x)<15 && Math.abs(z)<15) continue; // Clear spawn

    let type = Math.random();
    let mesh;
    if(type < 0.4) {
      mesh = new THREE.Mesh(obsGeo1, obsMat1); // Gedung kecil
      mesh.position.set(x, 4, z);
    } else if(type < 0.7) {
      mesh = new THREE.Mesh(obsGeo2, obsMat2); // Pohon
      mesh.position.set(x, 3, z);
    } else {
      mesh = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), new THREE.MeshLambertMaterial({color:0x696969})); // Batu
      mesh.position.set(x, 1.5, z);
    }
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    obstacles.push({ mesh, x, z, radius: type < 0.4 ? 3 : 2.5 });
  }

  // Zone Visual (Silinder transparan)
  const zoneGeo = new THREE.CylinderGeometry(zone.radius, zone.radius, 50, 32, 1, true);
  const zoneMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
  const zoneMesh = new THREE.Mesh(zoneGeo, zoneMat);
  zoneMesh.position.y = 25;
  scene.add(zoneMesh);
  window.zoneMesh = zoneMesh;
}

// ===== PEMBUATAN KARAKTER =====
function createCharacter(isPlayer, x, z) {
  const group = new THREE.Group();
  
  // Tubuh
  const bodyGeo = new THREE.CylinderGeometry(0.8, 0.8, 2.5, 8);
  const bodyMat = new THREE.MeshLambertMaterial({ color: isPlayer ? 0x4ade80 : 0xef4444 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 1.25;
  body.castShadow = true;
  group.add(body);

  // Kepala
  const headGeo = new THREE.SphereGeometry(0.6, 8, 8);
  const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 2.8;
  head.castShadow = true;
  group.add(head);

  // Senjata
  const gunGeo = new THREE.BoxGeometry(0.2, 0.2, 1.2);
  const gunMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
  const gun = new THREE.Mesh(gunGeo, gunMat);
  gun.position.set(0.6, 1.8, 0.8);
  group.add(gun);

  group.position.set(x, 0, z);
  scene.add(group);

  return {
    mesh: group, body, head, gun,
    x, z, y: 0,
    vx: 0, vz: 0,
    hp: 100, armor: 0,
    weapon: 'pistol', ammo: 12, reloading: false, reloadTimer: 0,
    isPlayer, alive: true,
    yaw: 0, // Arah hadap
    aiTimer: 0, aiState: 'wander', target: null
  };
}

// ===== LOGIKA GAME =====
function startGame() {
  document.getElementById('startModal').classList.add('hidden');
  initThree();
  createWorld();

  player = createCharacter(true, 0, 0);
  bots = [];
  for(let i=0; i<PLAYER_COUNT-1; i++) {
    let x, z;
    do {
      x = (Math.random()-0.5) * WORLD_SIZE * 0.8;
      z = (Math.random()-0.5) * WORLD_SIZE * 0.8;
    } while(Math.sqrt(x*x + z*z) < 30);
    bots.push(createCharacter(false, x, z));
  }

  // Loot
  for(let i=0; i<20; i++) {
    const wKeys = Object.keys(WEAPONS);
    const w = wKeys[Math.floor(Math.random()*wKeys.length)];
    const geo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const mat = new THREE.MeshLambertMaterial({ color: WEAPONS[w].color });
    const mesh = new THREE.Mesh(geo, mat);
    let lx = (Math.random()-0.5) * WORLD_SIZE * 0.8;
    let lz = (Math.random()-0.5) * WORLD_SIZE * 0.8;
    mesh.position.set(lx, 0.4, lz);
    scene.add(mesh);
    lootItems.push({ mesh, type: 'weapon', weapon: w, x: lx, z: lz });
  }

  gameActive = true;
  animate();
}

function updatePlayer(dt) {
  if(!player.alive) return;

  let moveX = 0, moveZ = 0;
  if(keys['w'] || keys['arrowup']) moveZ -= 1;
  if(keys['s'] || keys['arrowdown']) moveZ += 1;
  if(keys['a'] || keys['arrowleft']) moveX -= 1;
  if(keys['d'] || keys['arrowright']) moveX += 1;
  if(joystick.active) { moveX = joystick.dx; moveZ = joystick.dy; }

  const speed = keys['shift'] ? 8 : 5;
  const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
  if(len > 0) {
    moveX /= len; moveZ /= len;
    // Rotasi gerakan berdasarkan kamera
    const cos = Math.cos(cameraAngle.yaw), sin = Math.sin(cameraAngle.yaw);
    const rx = moveX * cos - moveZ * sin;
    const rz = moveX * sin + moveZ * cos;
    player.vx = rx * speed;
    player.vz = rz * speed;
    player.yaw = Math.atan2(rx, rz);
  } else {
    player.vx *= 0.8; player.vz *= 0.8;
  }

  // Apply movement & collision
  let nx = player.x + player.vx * dt;
  let nz = player.z + player.vz * dt;
  
  // Batas dunia
  nx = Math.max(-WORLD_SIZE/2+2, Math.min(WORLD_SIZE/2-2, nx));
  nz = Math.max(-WORLD_SIZE/2+2, Math.min(WORLD_SIZE/2-2, nz));

  // Collision obstacle
  let canMove = true;
  for(let obs of obstacles) {
    if(Math.sqrt((nx-obs.x)**2 + (nz-obs.z)**2) < obs.radius + 1) { canMove = false; break; }
  }
  if(canMove) { player.x = nx; player.z = nz; }

  player.mesh.position.set(player.x, 0, player.z);
  player.mesh.rotation.y = player.yaw;

  // Reload
  if(player.reloading) {
    player.reloadTimer -= dt;
    if(player.reloadTimer <= 0) {
      player.ammo = WEAPONS[player.weapon].ammo;
      player.reloading = false;
      updateHUD();
    }
  }

  // Shooting
  if((mouse.down || isFiring) && !player.reloading) {
    shoot(player);
  }

  // Pickup loot
  for(let i=lootItems.length-1; i>=0; i--) {
    let l = lootItems[i];
    if(Math.sqrt((player.x-l.x)**2 + (player.z-l.z)**2) < 2) {
      if(l.type === 'weapon') {
        player.weapon = l.weapon;
        player.ammo = WEAPONS[l.weapon].ammo;
        player.reloading = false;
        // Update warna senjata
        player.gun.material.color.setHex(WEAPONS[l.weapon].color);
      }
      scene.remove(l.mesh);
      lootItems.splice(i, 1);
      updateHUD();
    }
  }

  // Zone damage
  if(Math.sqrt(player.x**2 + player.z**2) > zone.radius) {
    player.hp -= 5 * dt;
    if(player.hp <= 0) killPlayer(null);
  }
}

function shoot(shooter) {
  const now = performance.now();
  const w = WEAPONS[shooter.weapon];
  if(now - lastShotTime < w.rate || shooter.ammo <= 0) return;
  if(shooter.isPlayer) lastShotTime = now;
  else if(Math.random() > 0.05) return; // AI fire rate limit

  shooter.ammo--;
  if(shooter.isPlayer) updateHUD();

  const pellets = w.pellets || 1;
  for(let i=0; i<pellets; i++) {
    const spread = (Math.random()-0.5) * w.spread * 2;
    const angle = shooter.yaw + spread;
    
    const geo = new THREE.SphereGeometry(0.15, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: w.color });
    const bullet = new THREE.Mesh(geo, mat);
    
    const bx = shooter.x + Math.sin(angle) * 1.5;
    const bz = shooter.z + Math.cos(angle) * 1.5;
    bullet.position.set(bx, 1.8, bz);
    scene.add(bullet);

    bullets.push({
      mesh: bullet,
      x: bx, z: bz, y: 1.8,
      vx: Math.sin(angle) * w.speed,
      vz: Math.cos(angle) * w.speed,
      dmg: w.dmg, owner: shooter, life: 2
    });
  }
}

function updateBots(dt) {
  bots.forEach(bot => {
    if(!bot.alive) return;

    // AI Logic
    bot.aiTimer -= dt;
    let nearest = null, nearDist = 999;
    
    // Cek player
    if(player.alive) {
      let d = Math.sqrt((player.x-bot.x)**2 + (player.z-bot.z)**2);
      if(d < nearDist) { nearDist = d; nearest = player; }
    }
    // Cek bot lain
    bots.forEach(b => {
      if(b===bot || !b.alive) return;
      let d = Math.sqrt((b.x-bot.x)**2 + (b.z-bot.z)**2);
      if(d < nearDist) { nearDist = d; nearest = b; }
    });

    // State
    if(bot.hp < 30 && nearDist < 20) bot.aiState = 'flee';
    else if(nearest && nearDist < 40) bot.aiState = 'fight';
    else if(bot.aiTimer <= 0) { bot.aiState = 'wander'; bot.aiTimer = Math.random()*2+1; }

    let mx=0, mz=0;
    if(bot.aiState === 'wander') {
      mx = Math.cos(bot.yaw) * 3;
      mz = Math.sin(bot.yaw) * 3;
      if(bot.aiTimer <= 0) { bot.yaw = Math.random()*Math.PI*2; bot.aiTimer = Math.random()*2+1; }
    } else if(nearest) {
      const dx = nearest.x - bot.x, dz = nearest.z - bot.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      bot.yaw = Math.atan2(dx, dz);
      
      if(bot.aiState === 'fight') {
        if(dist > 15) { mx = (dx/dist)*4; mz = (dz/dist)*4; }
        shoot(bot);
      } else if(bot.aiState === 'flee') {
        mx = -(dx/dist)*5; mz = -(dz/dist)*5;
      }
    }

    // Move to zone center if outside
    const distToCenter = Math.sqrt(bot.x**2 + bot.z**2);
    if(distToCenter > zone.radius * 0.8) {
      const toCenter = Math.atan2(-bot.x, -bot.z);
      mx += Math.sin(toCenter) * 4;
      mz += Math.cos(toCenter) * 4;
    }

    let nx = bot.x + mx * dt;
    let nz = bot.z + mz * dt;
    nx = Math.max(-WORLD_SIZE/2+2, Math.min(WORLD_SIZE/2-2, nx));
    nz = Math.max(-WORLD_SIZE/2+2, Math.min(WORLD_SIZE/2-2, nz));

    let canMove = true;
    for(let obs of obstacles) {
      if(Math.sqrt((nx-obs.x)**2 + (nz-obs.z)**2) < obs.radius + 1) { canMove = false; break; }
    }
    if(canMove) { bot.x = nx; bot.z = nz; }

    bot.mesh.position.set(bot.x, 0, bot.z);
    bot.mesh.rotation.y = bot.yaw;

    // Zone damage
    if(distToCenter > zone.radius) {
      bot.hp -= 5 * dt;
      if(bot.hp <= 0) killBot(bot, null);
    }
  });
}

function updateBullets(dt) {
  for(let i=bullets.length-1; i>=0; i--) {
    let b = bullets[i];
    b.x += b.vx * dt;
    b.z += b.vz * dt;
    b.life -= dt;
    b.mesh.position.set(b.x, b.y, b.z);

    let hit = false;
    // Hit obstacles
    for(let obs of obstacles) {
      if(Math.sqrt((b.x-obs.x)**2 + (b.z-obs.z)**2) < obs.radius) { hit = true; break; }
    }
    // Hit entities
    if(!hit) {
      const targets = [player, ...bots].filter(e => e.alive && e !== b.owner);
      for(let t of targets) {
        if(Math.sqrt((b.x-t.x)**2 + (b.z-t.z)**2) < 1.2) {
          let dmg = b.dmg;
          if(t.armor > 0) { let abs = Math.min(t.armor, dmg*0.6); t.armor -= abs; dmg -= abs; }
          t.hp -= dmg;
          if(t.isPlayer && t.hp <= 0) killPlayer(b.owner);
          else if(!t.isPlayer && t.hp <= 0) killBot(t, b.owner);
          hit = true; break;
        }
      }
    }

    if(hit || b.life <= 0) {
      scene.remove(b.mesh);
      bullets.splice(i, 1);
    }
  }
}

function killPlayer(killer) {
  player.alive = false;
  player.mesh.visible = false;
  endGame(false, aliveCount);
}

function killBot(bot, killer) {
  bot.alive = false;
  bot.mesh.visible = false;
  aliveCount--;
  document.getElementById('aliveCount').textContent = aliveCount;
  if(killer && killer.isPlayer) {
    kills++;
    document.getElementById('killCount').textContent = kills;
  }
  if(aliveCount <= 1 && player.alive) endGame(true, 1);
}

function updateZone(dt) {
  zone.timer -= dt;
  if(zone.timer <= 0) {
    zone.phase++;
    zone.timer = ZONE_SHRINK_TIME;
    zone.targetRadius = Math.max(20, zone.radius * 0.6);
  }
  if(zone.radius > zone.targetRadius) {
    zone.radius -= (zone.radius - zone.targetRadius) * dt * 0.5;
    // Update visual
    scene.remove(window.zoneMesh);
    const geo = new THREE.CylinderGeometry(zone.radius, zone.radius, 50, 32, 1, true);
    const mat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
    window.zoneMesh = new THREE.Mesh(geo, mat);
    window.zoneMesh.position.y = 25;
    scene.add(window.zoneMesh);
  }
  const m = Math.floor(zone.timer/60), s = Math.floor(zone.timer%60);
  document.getElementById('zoneTimer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function updateCamera() {
  if(!player.alive) return;
  const dist = 8;
  const height = 4 + Math.sin(cameraAngle.pitch) * 5;
  const cx = player.x - Math.sin(cameraAngle.yaw) * dist;
  const cz = player.z - Math.cos(cameraAngle.yaw) * dist;
  
  camera.position.set(cx, height, cz);
  camera.lookAt(player.x, 2, player.z);
}

function updateHUD() {
  if(!player) return;
  document.getElementById('hpFill').style.width = Math.max(0, player.hp) + '%';
  document.getElementById('hpText').textContent = Math.floor(Math.max(0, player.hp));
  document.getElementById('armorFill').style.width = player.armor + '%';
  document.getElementById('armorText').textContent = Math.floor(player.armor);
  document.getElementById('weaponName').textContent = WEAPONS[player.weapon].name;
  document.getElementById('ammoCount').textContent = player.reloading ? 'RELOAD' : player.ammo;
}

function drawMinimap() {
  const ctx = document.getElementById('minimapCanvas').getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(0,0,120,120);
  const scale = 120 / WORLD_SIZE;
  const cx = 60, cy = 60;

  // Zone
  ctx.beginPath();
  ctx.arc(cx + zone.x*scale, cy + zone.z*scale, zone.radius*scale, 0, Math.PI*2);
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();

  // Bots
  bots.forEach(b => {
    if(!b.alive) return;
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(cx + b.x*scale - 1, cy + b.z*scale - 1, 3, 3);
  });

  // Player
  if(player.alive) {
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.arc(cx + player.x*scale, cy + player.z*scale, 3, 0, Math.PI*2); ctx.fill();
    // Direction
    ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx + player.x*scale, cy + player.z*scale);
    ctx.lineTo(cx + (player.x + Math.sin(player.yaw)*10)*scale, cy + (player.z + Math.cos(player.yaw)*10)*scale);
    ctx.stroke();
  }
}

function endGame(win, rank) {
  gameActive = false;
  document.getElementById('endTitle').textContent = win ? '🏆 BOOYAH!' : '💀 ELIMINATED';
  document.getElementById('endMsg').textContent = win ? 'Kamu adalah yang terakhir bertahan!' : `Peringkat #${rank}`;
  document.getElementById('endKills').textContent = kills;
  document.getElementById('endRank').textContent = '#' + rank;
  document.getElementById('endModal').classList.remove('hidden');
}

// ===== GAME LOOP =====
function animate() {
  if(!gameActive) return;
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  updatePlayer(dt);
  updateBots(dt);
  updateBullets(dt);
  updateZone(dt);
  updateCamera();
  drawMinimap();
  updateHUD();

  renderer.render(scene, camera);
}

// ===== INPUT HANDLING =====
document.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if(e.key.toLowerCase() === 'r' && player && !player.reloading && player.ammo < WEAPONS[player.weapon].ammo) {
    player.reloading = true;
    player.reloadTimer = WEAPONS[player.weapon].reload;
    updateHUD();
  }
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// Mouse Look (PC)
document.addEventListener('mousemove', e => {
  if(document.pointerLockElement === document.body) {
    cameraAngle.yaw -= e.movementX * 0.002;
    cameraAngle.pitch = Math.max(-0.5, Math.min(1.2, cameraAngle.pitch + e.movementY * 0.002));
  }
});
document.addEventListener('mousedown', e => {
  if(e.button === 0) {
    if(!document.pointerLockElement) document.body.requestPointerLock();
    mouse.down = true;
  }
});
document.addEventListener('mouseup', () => { mouse.down = false; });

// Touch Look (Mobile)
document.addEventListener('touchstart', e => {
  for(let t of e.changedTouches) {
    if(t.clientX > window.innerWidth/2 && t.clientY < window.innerHeight - 100) {
      lookTouch.active = true;
      lookTouch.startX = t.clientX;
      lookTouch.startY = t.clientY;
    }
  }
});
document.addEventListener('touchmove', e => {
  for(let t of e.changedTouches) {
    if(lookTouch.active && t.clientX > window.innerWidth/2) {
      const dx = t.clientX - lookTouch.startX;
      const dy = t.clientY - lookTouch.startY;
      cameraAngle.yaw -= dx * 0.005;
      cameraAngle.pitch = Math.max(-0.5, Math.min(1.2, cameraAngle.pitch + dy * 0.005));
      lookTouch.startX = t.clientX;
      lookTouch.startY = t.clientY;
    }
  }
});
document.addEventListener('touchend', () => { lookTouch.active = false; });

// Joystick Mobile
const jZone = document.getElementById('joystickZone');
const jThumb = document.getElementById('joystickThumb');
const jBase = document.getElementById('joystickBase');
let jCenter = {x:0, y:0};

jZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = jBase.getBoundingClientRect();
  jCenter = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
  joystick.active = true;
  handleJoystick(e.touches[0]);
}, {passive:false});

jZone.addEventListener('touchmove', e => {
  e.preventDefault();
  if(joystick.active) handleJoystick(e.touches[0]);
}, {passive:false});

jZone.addEventListener('touchend', e => {
  e.preventDefault();
  joystick.active = false;
  joystick.dx = 0; joystick.dy = 0;
  jThumb.style.transform = 'translate(-50%, -50%)';
});

function handleJoystick(touch) {
  const dx = touch.clientX - jCenter.x;
  const dy = touch.clientY - jCenter.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const max = 40;
  const c = Math.min(dist, max);
  const a = Math.atan2(dy, dx);
  const tx = Math.cos(a)*c, ty = Math.sin(a)*c;
  jThumb.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
  joystick.dx = tx/max;
  joystick.dy = ty/max;
}

// Fire Button
const fireBtn = document.getElementById('fireBtn');
fireBtn.addEventListener('touchstart', e => { e.preventDefault(); isFiring = true; }, {passive:false});
fireBtn.addEventListener('touchend', e => { e.preventDefault(); isFiring = false; });
</script>
